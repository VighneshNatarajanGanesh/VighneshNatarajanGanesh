name: Update README cards

# The public github-readme-stats.vercel.app instance is paused, so the repo
# cards are generated here and committed to profile/ instead.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *" # daily
  workflow_dispatch:

concurrency:
  group: readme-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      # fail_on_error + continue-on-error: a transient API failure keeps the
      # last good card instead of overwriting it with an error card.
      - name: Pin card - DSSGxUK/bmwi
        uses: stats-organization/github-readme-stats-action@v2
        continue-on-error: true
        with:
          card: pin
          options: username=DSSGxUK&repo=bmwi
          path: profile/pin-DSSGxUK-bmwi.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Pin card - bitssmac/smacOnline
        uses: stats-organization/github-readme-stats-action@v2
        continue-on-error: true
        with:
          card: pin
          options: username=bitssmac&repo=smacOnline
          path: profile/pin-bitssmac-smacOnline.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Pin card - VighneshNatarajanGanesh/Trigger_word_detection
        uses: stats-organization/github-readme-stats-action@v2
        continue-on-error: true
        with:
          card: pin
          options: username=VighneshNatarajanGanesh&repo=Trigger_word_detection
          path: profile/pin-VighneshNatarajanGanesh-Trigger_word_detection.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
